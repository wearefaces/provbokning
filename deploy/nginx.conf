# /etc/nginx/sites-available/provbok
# Replace __DOMAIN__ with your real hostname before enabling.
# certbot --nginx will inject the SSL block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Allow Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else: forward to gunicorn on localhost.
    # After certbot runs, this server block becomes the redirect-to-HTTPS block
    # and a new HTTPS server block is added below it.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 2m;
    }
}
