<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logga in · Provbokningsbevakning</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eceef2;
  --card:#ffffff;
  --border:#e6e8ed;
  --accent:#0e1419;
  --accent2:#1f2933;
  --accent-bg:rgba(14,20,25,.05);
  --red:#dc2626;
  --red-bg:#fdeaea;
  --red-border:rgba(220,38,38,.22);
  --text:#0f172a;
  --text3:#94a3b8;
  --shadow-lg:0 20px 60px rgba(15,23,42,.12);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;
}
.box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:38px 34px 30px;
  width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);
}
.logo{text-align:center;margin-bottom:26px}
.logo h1{font-size:1.55rem;font-weight:700;letter-spacing:-.03em}
.logo h1 .muted{color:var(--text3);font-weight:600}
.logo p{color:var(--text3);font-size:.88rem;margin-top:6px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.74rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.field input{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text);font-size:.95rem;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{
  margin-top:8px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 26px;border:1px solid transparent;border-radius:999px;
  background:var(--accent);color:#fff;font-size:.98rem;font-weight:600;line-height:1.6;white-space:nowrap;
  cursor:pointer;font-family:inherit;transition:background-color .2s,box-shadow .2s,transform .2s;
}
.btn:hover{background:var(--accent2);box-shadow:0 10px 24px -10px rgba(14,20,25,.5)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn .arr{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#01d27b;color:var(--accent);align-items:center;justify-content:center;font-size:.8rem}
:focus-visible{outline:2px solid #047a4a;outline-offset:3px}
.err{
  background:var(--red-bg);border:1px solid var(--red-border);
  color:var(--red);font-size:.86rem;padding:11px 13px;border-radius:12px;
  text-align:center;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1><img src="/static/logo.png" alt="Provbokning" style="height:36px;width:auto"></h1>
    <p>Logga in för att fortsätta</p>
  </div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    <div class="field">
      <label for="username">Användarnamn</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Lösenord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Logga in <span class="arr" aria-hidden="true">→</span></button>
  </form>
</div>
</body>
</html>
