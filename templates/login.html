<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logga in · Provbokningsbevakning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fb;
  --card:#ffffff;
  --border:#e2e5eb;
  --accent:#4f46e5;
  --accent2:#6366f1;
  --accent-bg:rgba(79,70,229,.07);
  --red:#dc2626;
  --red-bg:rgba(220,38,38,.06);
  --red-border:rgba(220,38,38,.18);
  --text:#1e293b;
  --text3:#94a3b8;
  --shadow-lg:0 10px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:linear-gradient(180deg,#f8f9fb 0%,#eef0f5 100%);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;
}
.box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:36px 32px 28px;
  width:100%;max-width:380px;
  box-shadow:var(--shadow-lg);
}
.logo{
  text-align:center;margin-bottom:24px;
}
.logo h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.logo p{color:var(--text3);font-size:.85rem;margin-top:4px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.72rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.field input{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;color:var(--text);font-size:.95rem;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{
  margin-top:6px;padding:11px 20px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .15s,box-shadow .15s;
}
.btn:hover{background:var(--accent2);box-shadow:0 2px 8px rgba(79,70,229,.25)}
.err{
  background:var(--red-bg);border:1px solid var(--red-border);
  color:var(--red);font-size:.85rem;padding:10px 12px;border-radius:8px;
  text-align:center;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>Provbokningsbevakning</h1>
    <p>Logga in för att fortsätta</p>
  </div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    <div class="field">
      <label for="username">Användarnamn</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Lösenord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Logga in</button>
  </form>
</div>
</body>
</html>
